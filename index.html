<script>
const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,D;
function size(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();

const dots=Array.from({length:110},()=>({x:Math.random(),y:.1+Math.random()*.8,r:.4+Math.random()*1.5,a:.12+Math.random()*.55,v:.00015+Math.random()*.00045,p:Math.random()*7}));

function path(side,t){
 let q=side?1-t:t;
 let y=side?.43+.105*Math.sin(t*Math.PI*1.65)+.018*Math.sin(t*Math.PI*4.2)
          :.57-.105*Math.sin(t*Math.PI*1.65)-.018*Math.sin(t*Math.PI*4.2);
 return [q,y];
}
function ribbon(side,head,alpha){
 x.save();x.globalCompositeOperation='lighter';x.lineCap='round';
 // wide blue aura
 x.beginPath();
 for(let i=0;i<=160;i++){let p=path(side,i/160),X=p[0]*W,Y=p[1]*H;i?x.lineTo(X,Y):x.moveTo(X,Y)}
 x.strokeStyle=`rgba(0,120,255,${alpha*.25})`;x.lineWidth=Math.max(9,W*.012);x.shadowBlur=28;x.shadowColor='rgba(0,120,255,.8)';x.stroke();
 // bright core
 x.beginPath();
 for(let i=0;i<=160;i++){let p=path(side,i/160),X=p[0]*W,Y=p[1]*H;i?x.lineTo(X,Y):x.moveTo(X,Y)}
 x.strokeStyle=`rgba(20,190,255,${alpha})`;x.lineWidth=Math.max(1.5,W*.0018);x.shadowBlur=12;x.shadowColor='#00bfff';x.stroke();
 // moving white-hot light
 let tail=Math.max(0,head-.12);
 x.beginPath();
 for(let i=0;i<=60;i++){let p=path(side,tail+(head-tail)*i/60),X=p[0]*W,Y=p[1]*H;i?x.lineTo(X,Y):x.moveTo(X,Y)}
 x.strokeStyle='rgba(220,250,255,.95)';x.lineWidth=Math.max(2,W*.003);x.shadowBlur=20;x.shadowColor='#4ddcff';x.stroke();
 x.restore();
}
let t0=performance.now();
function frame(now){
 let t=(now-t0)/1000;x.clearRect(0,0,W,H);
 x.save();x.globalCompositeOperation='lighter';
 dots.forEach(d=>{d.x+=d.v;if(d.x>1.04)d.x=-.04;d.p+=.02;
   let a=d.a*(.55+.45*Math.sin(d.p)),r=d.r;
   x.beginPath();x.arc(d.x*W,d.y*H,r,0,7);
   x.fillStyle=`rgba(80,200,255,${a})`;x.shadowBlur=9;x.shadowColor='#008cff';x.fill();
 });x.restore();
 ribbon(0,(t*.075)%1,.9);ribbon(1,(1-t*.065)%1,.85);
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
